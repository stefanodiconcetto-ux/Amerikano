<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Amerikano" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="theme-color" content="#132a24" />
  <meta name="description" content="Segnapunti per il gioco di carte Amerikano" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=20261025-mobile-recovery" />
  <title>Amerikano Segnapunti</title>
</head>
<body>
  <div class="felt"></div>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toast" class="toast" role="status"></div>
  <script>
  // Evita una schermata verde senza indicazioni in caso di errore d'avvio.
  (function(){
    function showRecovery(){
      var app=document.getElementById('app');
      if(!app||app.textContent.trim())return;
      app.innerHTML='<section class="panel" style="margin:10vh auto;max-width:640px;padding:24px"><h2>Amerikano non si è avviato</h2><p>La pagina potrebbe avere file non aggiornati. Ricarica la pagina; se il problema continua, apri la stessa partita in una nuova scheda.</p><button type="button" id="amerikano-retry" style="padding:12px 18px">Ricarica</button></section>';
      var btn=document.getElementById('amerikano-retry');
      if(btn)btn.onclick=function(){location.reload();};
    }
    window.addEventListener('error',function(){setTimeout(showRecovery,0);});
    window.addEventListener('unhandledrejection',function(){setTimeout(showRecovery,0);});
    window.addEventListener('load',function(){setTimeout(showRecovery,6500);});
  })();
  </script>
  <script src="./i18n.js?v=20261025-mobile-recovery" defer></script>
  <script src="./supabase-config.js?v=20261025-mobile-recovery" defer></script>
  <script src="./share.js?v=20261025-mobile-recovery" defer></script>
  <script src="./docs.js?v=20261025-mobile-recovery" defer></script>
  <script src="./app.js?v=20261025-mobile-recovery" defer></script>
</body>
</html>
